{% extends 'assets/base.html' %}

{% block title %}Asset Form{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if form.instance.pk %}Edit Asset{% else %}Create Asset{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save Asset</button>
        <a class="btn secondary" href="{% url 'asset-list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
